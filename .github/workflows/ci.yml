name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jrschumacher/go-actions/ci@v3
        with:
          job: test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install pinned golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: Run golangci-lint
        run: |
          "$(go env GOPATH)/bin/golangci-lint" run ./...

  proto:
    name: Proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.69.0
      - name: Lint
        run: buf lint
      - name: Generated code is current
        run: |
          buf generate
          git diff --exit-code -- gen
          test -z "$(git status --porcelain -- gen)"
      - name: No breaking changes against main
        # gso is public, so the remote URL needs no credentials. A PR checkout
        # has no local "main" branch, which is why .git#branch=main is not used.
        run: |
          if git cat-file -e origin/main:proto/gso/worker/v1/worker.proto 2>/dev/null; then
            buf breaking --against "https://github.com/${GITHUB_REPOSITORY}.git#branch=main"
          else
            echo "main has no gso.worker.v1 proto yet; skipping buf breaking"
          fi

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jrschumacher/go-actions/ci@v3
        with:
          job: security

  cross:
    name: Cross-compile release targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build every goreleaser target
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "building $target"
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null . || exit 1
          done
