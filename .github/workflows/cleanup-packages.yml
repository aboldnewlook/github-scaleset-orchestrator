name: Cleanup packages

# The weekly schedule is off: delete-package-versions removes the untagged
# per-platform manifests that multi-arch tags point to, which breaks pulls of
# older tags (and rollback). Re-enable only with a multi-arch-aware cleanup.
on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  cleanup:
    name: Delete old container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: github-scaleset-orchestrator
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: false
          ignore-versions: "^(latest|\\d+|\\d+\\.\\d+)$"
